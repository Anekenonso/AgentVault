  <circle cx="32" cy="28.5" r="3" fill="#1f4d3a" stroke="#faf6ef" strokeWidth="1.2" />

  <!-- Invariant Latch: Terracotta Accent -->
  <line x1="32" y1="36" x2="32" y2="44" stroke="#c2512f" strokeWidth="2" strokeLinecap="round" />
  <circle cx="32" cy="44" r="1.8" fill="#c2512f" />
